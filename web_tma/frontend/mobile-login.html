<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6550b5"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/static/hunter.css"><link rel="stylesheet" href="/static/appearance.css"><title>Увійти в Hunter</title></head><body><main class="phone-login panel"><img width="72" height="72" src="/static/icons/hunter-192.png" alt=""><h1>Hunter на телефоні</h1><p>Отримай код у власника Hunter: на ПК — кнопка «На телефон», для серверної версії — керування доступом на сервері. Відскануй QR або введи код нижче.</p><form id="pair-form"><label for="pair-code">Одноразовий код доступу</label><input id="pair-code" required maxlength="80" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false"><button class="primary" type="submit">Підключити телефон</button></form><p id="pair-status" role="status"></p><p class="muted">Код діє 10 хвилин. Після входу можна встановити Hunter з меню Chrome.</p></main><script src="/static/mobile-login.js" defer></script></body></html>
