<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6550b5"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icons/hunter-192.png">
<title>Hunter — дослідження та робота</title><link rel="stylesheet" href="/static/hunter.css"><link rel="stylesheet" href="/static/appearance.css?v=1"></head>
<body><header><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">◇</span><span>HUNTER <small>Дослідження з доказами</small></span></a>
<div id="stats" aria-live="polite"></div><div class="phone-actions"><button id="phone-connect">📱 На телефон</button><button id="pwa-install" hidden>Встановити Hunter</button><button id="phone-logout" hidden>Вийти на телефоні</button><span class="local" id="connection-label">ПК · спільна база</span></div></header>
<nav aria-label="Розділи">
<button data-tab="tracking" class="active">⭐ У роботі</button><button data-tab="new">Знайдені проєкти</button><button data-tab="ignored">Не беремо</button>
<button data-tab="sources">Джерела</button><button data-tab="jobs">Команда агентів</button>
<button data-tab="history">Історичні кейси</button><button data-tab="market">Ринок і сценарії</button>
</nav><div id="notice" role="status" hidden></div>
<div id="connection-notice" role="status" hidden></div><main id="content"></main>
<dialog id="project"><button id="close-detail" class="close" aria-label="Закрити">×</button><div id="detail"></div></dialog>
<dialog id="phone-dialog"><button id="phone-close" class="close" aria-label="Закрити підключення">×</button><div id="phone-content"></div></dialog>
<footer>Дослідження → перевірка умов → твій вибір → дії. Підпис у гаманці залишається за тобою.</footer>
<script type="module" src="/static/hunter.js"></script><script type="module" src="/static/pwa.js"></script></body></html>
